<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<script src="/i18n.js"></script>
<script>try{var t=localStorage.getItem("pb_theme"),d=localStorage.getItem("pb_design"),e=document.documentElement;if(d==="klar"||d==="kompakt")e.setAttribute("data-design",d);else d="";if(t==="light"||t==="dark")e.setAttribute("data-theme",t);else if(d==="klar")e.setAttribute("data-theme","light")}catch(e){}</script>
<title>IRL4YOU BOX</title>
<style>
:root{--bg:#0f172a;--card:#1e293b;--text:#f8fafc;--muted:#a8b4c7;--line:#50647f;--accent:#06b6d4;--ok:#22c55e;--warn:#f59e0b;--crit:#ef4444;--bar:#06b6d4}
:root{color-scheme:dark}
:root[data-theme="light"]{color-scheme:light;--bg:#f1f5f9;--card:#ffffff;--text:#0f172a;--muted:#475569;--line:#cbd5e1;--accent:#0e7490;--ok:#16a34a;--warn:#d97706;--crit:#dc2626;--bar:#0891b2;--blue:#2563eb}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);font:15px/1.4 -apple-system,system-ui,sans-serif;padding:16px}
#lang_sel{position:fixed;top:12px;right:12px;padding:4px 6px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit;font-size:13px}
form{width:100%;max-width:360px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px;display:grid;gap:10px}
h1{font-size:20px;margin:0;color:var(--accent)}
p{margin:0;color:var(--muted);font-size:13px}
input,button{font:inherit;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text)}
button{background:var(--bar);color:#0f172a;font-weight:600;border-color:transparent;cursor:pointer}
.err{color:var(--crit);font-size:13px;min-height:18px}
.rem{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);cursor:pointer;user-select:none}
.rem input{width:18px;height:18px;padding:0;margin:0;accent-color:var(--bar)}
/* Designs (wie in der Oberfläche, Optionen > Design) */
:root[data-design="klar"]{--bg:#f4f6fb;--card:#ffffff;--text:#172033;--muted:#566177;--line:#dde3ee;--accent:#2457d6;--bar:#2457d6}
:root[data-design="klar"][data-theme="dark"]{--bg:#0e1420;--card:#171f2e;--text:#eef2fa;--muted:#aab5c9;--line:#2b364b;--accent:#7aa2ff;--bar:#7aa2ff}
:root[data-design="kompakt"]{--bg:#0b0f14;--card:#121821;--text:#e6ebf2;--muted:#9aa7b8;--line:#263142;--accent:#37c8e0;--bar:#37c8e0}
:root[data-design="kompakt"][data-theme="light"]{--bg:#e9edf2;--card:#ffffff;--text:#111827;--muted:#4b5668;--line:#c9d1dc;--accent:#0a6a85;--bar:#0a7f9d}
:root[data-design="klar"] form{border:0;border-radius:18px;padding:26px;box-shadow:0 1px 2px rgba(23,32,51,.1),0 8px 28px rgba(23,32,51,.12)}
:root[data-design="klar"] body{font-size:16px;line-height:1.55}
:root[data-design="klar"] input,:root[data-design="klar"] button{min-height:46px;border-radius:12px;font-size:16px;border-width:1.5px}
:root[data-design="klar"] button{border-radius:999px;color:#fff}
:root[data-design="klar"][data-theme="dark"] button{color:#0b1220}
:root[data-design="kompakt"] form{border-radius:6px;padding:16px}
:root[data-design="kompakt"] input,:root[data-design="kompakt"] button{border-radius:6px;padding:7px 10px}
:root[data-design="kompakt"][data-theme="light"] button{color:#fff}
:root[data-design] :is(input,button,select):focus-visible{outline:3px solid var(--accent);outline-offset:2px}
/* Sprachauswahl (web/i18n.js): behält ihre eigenen Farben, die Knöpfe der Designs gelten dort nicht */
:root[data-design] :is(.pbpick,.langbtns) button{background:var(--bg);color:var(--text);border:1px solid var(--line);font-weight:500;border-radius:10px;min-height:44px;padding:10px 12px;font-size:16px;filter:none}
:root[data-design] :is(.pbpick,.langbtns) button.on{background:var(--bar);border-color:var(--bar);color:var(--card);font-weight:700}
</style>
</head>
<body>
<select id="lang_sel" data-lang translate="no" aria-label="Language" title="Language"></select>
<form id="f">
  <h1>IRL4YOU BOX</h1>
  <p id="hint">Anmelden</p>
  <input id="code" placeholder="Setup-Code" autocomplete="off" hidden>
  <input id="pw" type="password" placeholder="Passwort" autocomplete="current-password" required>
  <input id="pw2" type="password" placeholder="Passwort wiederholen" autocomplete="new-password" hidden>
  <label class="rem"><input id="rem" type="checkbox"> Angemeldet bleiben</label>
  <button type="submit" id="btn">Anmelden</button>
  <div class="err" id="err"></div>
</form>
<script>
const $=id=>document.getElementById(id);
let setup=false, waiting=false;
function check(){
  fetch("/api/auth").then(r=>r.json()).then(a=>{
    if(a.authed){location.reload();return;}
    if(a.mode==="belabox-wartet"){            // frische BELABOX: das Passwort wird zuerst in der BELABOX-Oberfläche festgelegt
      $("hint").textContent="Auf dieser BELABOX ist noch kein Passwort gesetzt. Bitte zuerst die BELABOX-Oberfläche öffnen (http://"+location.hostname+"/), dort ein Passwort festlegen und danach hier mit diesem Passwort anmelden. Diese Seite wartet darauf.";
      waiting=true;
      $("pw").hidden=true; $("pw").required=false; $("btn").hidden=true; $("code").hidden=true; $("pw2").hidden=true;
      setTimeout(check,3000);
      return;
    }
    if(waiting&&a.configured){ location.reload(); return; }          // Passwort ist inzwischen gesetzt: Anmeldung zeigen
    setup=!a.configured;
    if(a.mode==="belabox") $("hint").textContent="Anmelden mit dem BELABOX-Passwort";
    if(a.mode==="demo"){ $("hint").textContent="Vorschau: Das Passwort ist schon eingetragen, einfach anmelden."; $("pw").value=a.demo_password||""; }
    if(setup){
      $("hint").textContent="Ersteinrichtung: Den Setup-Code finden Sie auf der Box in der Datei /var/lib/pipbox/setup-code. Dann Passwort festlegen (mindestens 10 Zeichen).";
      $("code").hidden=false; $("pw2").hidden=false; $("btn").textContent="Passwort festlegen";
      $("pw").autocomplete="new-password";
    }
  });
}
check();
$("f").addEventListener("submit",async e=>{
  e.preventDefault(); $("err").textContent="";
  if(setup && $("pw").value!==$("pw2").value){ $("err").textContent="Die Passwörter stimmen nicht überein"; return; }
  const body=setup?{code:$("code").value.trim(),password:$("pw").value,remember:$("rem").checked}:{password:$("pw").value,remember:$("rem").checked};
  const r=await fetch(setup?"/api/setup":"/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  if(r.ok) location.reload(); else $("err").textContent=(await r.json()).error;
});
</script>
</body>
</html>
