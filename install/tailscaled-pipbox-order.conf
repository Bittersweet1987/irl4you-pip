# IRL4YOU BOX: tailscaled startet erst, wenn das Netz da ist und die Uhr aus dem Netz gestellt wurde (die Box hat keine Echtzeituhr: nach einem Stromausfall steht die Uhr
# zuerst auf dem Stand der letzten Sicherung, und eine falsche Zeit stört die Anmeldung beim Tailscale-Server und die öffentliche Freigabe).
# Nur eine Reihenfolge, keine Voraussetzung: Kommt das Netz nicht, startet tailscaled nach der Wartezeit von network-online.target trotzdem.
[Unit]
After=network-online.target time-sync.target
Wants=network-online.target
